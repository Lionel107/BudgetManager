# ============================================================================
# Réglages adaptés à une machine à RAM limitée (~7,5 Go).
# Objectif : éviter les OOM (échec d'allocation mémoire native) qui plantaient
# les builds et généraient des dumps hs_err_pid / replay_pid.
#
# Principe : UNE SEULE JVM pendant le build.
#   - compilation Kotlin "in-process" -> pas de 2e JVM (daemon Kotlin)
#   - daemon Gradle désactivé -> la JVM se libère après le build (rien ne traîne)
# ============================================================================
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true

kotlin.code.style=official
# Compile dans la JVM Gradle au lieu d'un daemon Kotlin séparé (économise une JVM)
kotlin.compiler.execution.strategy=in-process
