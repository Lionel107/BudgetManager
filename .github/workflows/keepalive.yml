name: Supabase keep-alive

# Empêche la mise en pause du projet Supabase (palier gratuit : pause après ~7 jours
# sans activité). On interroge l'API REST tous les 3 jours → maintient la base active.

on:
  schedule:
    - cron: "0 6 */3 * *"   # tous les 3 jours à 06:00 UTC
  workflow_dispatch:        # permet aussi un lancement manuel depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Ping $SUPABASE_URL"
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/categories?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          # 200 (avec la RLS, renvoie [] sans session) = base bien active
          if [ "$code" != "200" ]; then
            echo "Réponse inattendue : $code" >&2
            exit 1
          fi
