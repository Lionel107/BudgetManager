<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e0e5ec" />
  <title>Budget Manager</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Budget" />
  <style>
    /* Charte "Émeraude Tech" (clair, plat, bordures fines, accent émeraude) */
    :root {
      --bg: #ffffff; --card: #ffffff; --border: #e1e7e4; --field: #f4f7f6;
      --accent: #0fb985; --accent2: #06d6c4;
      --text: #0c1512; --text2: #5b6b65; --text3: #94a39c;
      --income: #0fb985; --expense: #f43f5e; --alert: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text); min-height: 100vh; letter-spacing: -.01em;
      background: var(--bg);
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    .wrap { max-width: 480px; margin: 0 auto; padding: 18px; }
    h1 { font-size: 1.4rem; font-weight: 750; color: var(--text); letter-spacing: -.02em; }
    .muted { color: var(--text2); font-size: .9rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin: 14px 0;
      box-shadow: 0 6px 22px rgba(12,21,18,.05);
    }
    label { display: block; font-size: .78rem; color: var(--text2); margin: 14px 0 6px; font-weight: 500; }
    input, select {
      width: 100%; font-size: 1rem; color: var(--text); outline: none;
      background: var(--field); border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15,185,133,.12); }
    select {
      appearance: none !important; -webkit-appearance: none !important; -moz-appearance: none !important;
      padding-right: 44px; cursor: pointer;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%235b6b65" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>');
      background-repeat: no-repeat; background-position: right 16px center;
    }
    select::-ms-expand { display: none; }
    select option { background: var(--card); color: var(--text); }
    button {
      width: 100%; font-size: 1rem; font-weight: 650; color: #04140e; cursor: pointer;
      background: linear-gradient(120deg, var(--accent), var(--accent2)); border: none; border-radius: 12px;
      padding: 15px; margin-top: 18px; box-shadow: 0 6px 18px rgba(15,185,133,.28);
    }
    button:active { transform: translateY(1px); }
    button.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); box-shadow: none; }
    button:disabled { opacity: .6; }
    .seg { display: flex; gap: 8px; }
    .seg button { margin-top: 0; background: var(--card); border: 1px solid var(--border); color: var(--text2); font-weight: 550; box-shadow: none; }
    .seg button.on-expense { background: var(--expense); color: #fff; border-color: transparent; }
    .seg button.on-income { background: var(--income); color: #fff; border-color: transparent; }
    .seg button.on-mode { background: linear-gradient(120deg, var(--accent), var(--accent2)); color: #04140e; border-color: transparent; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .link { color: var(--accent); text-align: center; margin-top: 16px; font-size: .9rem; cursor: pointer; }
    .msg { text-align: center; font-size: .85rem; margin-top: 12px; }
    .msg.err { color: var(--alert); }
    .msg.ok { color: var(--income); }
    .txn { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); }
    .txn:last-child { border-bottom: none; }
    .amt.exp { color: var(--expense); font-weight: 650; }
    .amt.inc { color: var(--income); font-weight: 650; }
    .eye { width: auto; margin: 0; padding: 8px 12px; background: var(--card); color: var(--text2);
      border: 1px solid var(--border); box-shadow: none; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 550; }
    .eye svg { width: 17px; height: 17px; }
    .acct { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .acct:last-child { border-bottom: none; }
    .acct .an { font-weight: 550; }
    .acct .at { font-size: .76rem; color: var(--text3); }
    .acct .bal { font-weight: 650; font-variant-numeric: tabular-nums; }
    .acct .bal.hidden-val { letter-spacing: 2px; color: var(--text3); }
    .hidden { display: none !important; }
    .logout { width: auto; margin: 0; padding: 8px 14px; font-size: .8rem; background: var(--card); color: var(--text2); border: 1px solid var(--border); box-shadow: none; }
    .spin { text-align: center; padding: 40px; color: var(--text2); }

    /* ---- Copilote : bulle flottante + panneau de discussion ---- */
    .fab {
      position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 40;
      width: 58px; height: 58px; margin: 0; padding: 0; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 26px rgba(15,185,133,.38); transition: transform .2s ease;
    }
    .fab:active { transform: scale(.94); }
    .fab svg { width: 26px; height: 26px; }
    .chat {
      position: fixed; inset: 0; z-index: 50; background: var(--bg);
      display: flex; flex-direction: column;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    }
    .chat.open { transform: translateY(0); }
    .chat-head {
      display: flex; align-items: center; gap: 10px; padding: 14px 16px;
      border-bottom: 1px solid var(--border); max-width: 480px; width: 100%; margin: 0 auto;
    }
    .chat-head .ttl { flex: 1; }
    .chat-head .ttl strong { display: block; font-size: 1.05rem; }
    .chat-head .ttl span { font-size: .76rem; color: var(--text3); }
    .icon-btn {
      width: 38px; height: 38px; margin: 0; padding: 0; border-radius: 10px; flex: none;
      background: var(--card); color: var(--text2); border: 1px solid var(--border); box-shadow: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .icon-btn svg { width: 18px; height: 18px; }
    .chat-body {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 16px; max-width: 480px; width: 100%; margin: 0 auto;
      display: flex; flex-direction: column; gap: 10px;
    }
    .bubble { max-width: 85%; padding: 10px 13px; border-radius: 16px; font-size: .95rem; line-height: 1.45; word-wrap: break-word; }
    .bubble.me { align-self: flex-end; background: linear-gradient(120deg, var(--accent), var(--accent2)); color: #04140e; border-bottom-right-radius: 5px; }
    .bubble.bot { align-self: flex-start; background: var(--field); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
    .bubble.err { color: var(--alert); }
    .bubble ul { margin: 6px 0 0 18px; }
    .typing { display: inline-flex; gap: 4px; }
    .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); animation: blink 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      width: auto; margin: 0; padding: 8px 12px; font: inherit; font-size: .84rem; font-weight: 550; border-radius: 999px;
      background: var(--card); color: var(--text); border: 1px solid var(--border); box-shadow: none;
    }
    .chat-foot {
      display: flex; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--border);
      max-width: 480px; width: 100%; margin: 0 auto;
    }
    .chat-foot input { flex: 1; }
    .send { width: 48px; height: 48px; margin: 0; padding: 0; flex: none; display: inline-flex; align-items: center; justify-content: center; }
    .send svg { width: 20px; height: 20px; }
    .keybox { background: var(--field); border: 1px solid var(--border); border-radius: 16px; padding: 14px; font-size: .9rem; }
    .keybox a { color: var(--accent); }
    .keybox button { margin-top: 10px; padding: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Chargement -->
    <div id="loading" class="spin">Chargement…</div>

    <!-- Connexion -->
    <div id="auth" class="hidden">
      <h1>Budget Manager</h1>
      <p class="muted" id="auth-sub">Connexion à ton compte</p>
      <div class="card">
        <label for="email">E-mail</label>
        <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="toi@exemple.fr" />
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••" />
        <button id="auth-btn">Se connecter</button>
        <div id="auth-msg" class="msg"></div>
        <div class="link" id="auth-toggle">Pas encore de compte ? En créer un</div>
      </div>
    </div>

    <!-- Application -->
    <div id="app" class="hidden">
      <div class="topbar">
        <h1>Ajouter</h1>
        <button class="logout" id="logout">Déconnexion</button>
      </div>
      <p class="muted" id="user-email"></p>

      <div class="card">
        <div class="seg">
          <button type="button" id="type-expense" class="on-expense">Dépense</button>
          <button type="button" id="type-income">Revenu</button>
        </div>

        <div class="seg" style="margin-top:10px">
          <button type="button" id="mode-once" class="on-mode">Ponctuelle</button>
          <button type="button" id="mode-recur">Récurrente</button>
        </div>

        <label for="amount">Montant (€)</label>
        <input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00" />

        <label for="title">Libellé</label>
        <input id="title" type="text" placeholder="Ex. Loyer" />

        <label for="account">Compte</label>
        <select id="account"></select>

        <label for="category">Catégorie</label>
        <select id="category"></select>

        <div id="freq-wrap" class="hidden">
          <label for="frequency">Fréquence</label>
          <select id="frequency">
            <option value="MONTHLY">Mensuelle</option>
            <option value="WEEKLY">Hebdomadaire</option>
            <option value="DAILY">Quotidienne</option>
            <option value="QUARTERLY">Trimestrielle</option>
            <option value="YEARLY">Annuelle</option>
          </select>
        </div>

        <label for="date" id="date-label">Date</label>
        <input id="date" type="date" />

        <button id="save">Enregistrer</button>
        <div id="save-msg" class="msg"></div>
      </div>

      <div class="card">
        <div class="row">
          <strong>Mes comptes</strong>
          <button id="toggle-balances" class="eye" type="button" aria-label="Afficher ou masquer les soldes">
            <span id="eye-ic"></span><span id="eye-tx">Afficher</span>
          </button>
        </div>
        <div id="accounts-list"></div>
      </div>

      <div class="card">
        <div class="row"><strong>Dernières transactions</strong></div>
        <div id="recent"></div>
      </div>
    </div>
  </div>

  <!-- Copilote : bulle flottante (visible une fois connecté) + panneau de discussion -->
  <button id="chat-fab" class="fab hidden" type="button" aria-label="Parler à mon copilote budget">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>
  </button>
  <div id="chat" class="chat" aria-hidden="true">
    <div class="chat-head">
      <div class="ttl"><strong>Mon copilote</strong><span>Il connaît ton profil et ton budget</span></div>
      <button id="chat-key" class="icon-btn" type="button" aria-label="Clé Gemini">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="3.5"/><path d="M10 13l9-9M16 7l2 2M14 9l2 2"/></svg>
      </button>
      <button id="chat-close" class="icon-btn" type="button" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="chat-body" class="chat-body"></div>
    <div class="chat-foot">
      <input id="chat-input" type="text" placeholder="Écris-lui…" autocomplete="off" enterkeyhint="send" />
      <button id="chat-send" class="send" type="button" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
